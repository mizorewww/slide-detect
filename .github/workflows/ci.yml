name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # bash on every runner: Windows' default pwsh does not stop multi-line
    # steps at the first failing native command.
    shell: bash

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Tests that need ffmpeg fail rather than skip when CI is set.
      - name: Install ffmpeg
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y ffmpeg ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg --no-progress --yes ;;
          esac
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy, default features
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy, all features
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build, CLI
        run: cargo build --locked --features cli
      - name: Clippy, CLI
        run: cargo clippy --all-targets --features cli -- -D warnings
      - name: Test, default features
        run: cargo test
      - name: Test, all features
        run: cargo test --all-features
      - name: Test, CLI
        run: cargo test --features cli

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
