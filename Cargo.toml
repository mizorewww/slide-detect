[package]
name = "slide-detect"
version = "0.1.0"
edition = "2024"
# image 0.25 needs 1.88.
rust-version = "1.88"
license = "MIT"
description = "Find the slide changes in a lecture video with ffmpeg and SSIM, and extract a full-resolution image of each"
repository = "https://github.com/mizorewww/slide-detect"
homepage = "https://github.com/mizorewww/slide-detect"
documentation = "https://docs.rs/slide-detect"
readme = "README.md"
keywords = ["slides", "video", "ffmpeg", "ssim", "scene-detection"]
categories = ["multimedia::video", "command-line-utilities"]
include = ["/src/**/*.rs", "/tests/**/*.rs", "/README.md", "/LICENSE"]

[features]
# The `slide-detect` command-line tool. Library users get none of its dependencies.
cli = [
    "dep:clap",
    "dep:ctrlc",
    "dep:serde_json",
    "dep:signal-hook",
    "dep:tempfile",
]

[[bin]]
name = "slide-detect"
path = "src/bin/slide-detect/main.rs"
required-features = ["cli"]

[dependencies]
image = { version = "0.25", default-features = false }
image-compare = "0.5"
clap = { version = "4.6", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tempfile = { version = "3", optional = true }

# Ctrl-C and SIGTERM, told apart for the exit code.
[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.4", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
ctrlc = { version = "3.5", optional = true }

[dev-dependencies]
tempfile = "3"
